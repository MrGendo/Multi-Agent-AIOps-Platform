# ============================================================
# Alembic 配置 — Multi-Agent AIOps Platform
# ============================================================
# 实际的数据库 URL 不写在这里, 由 alembic/env.py 动态解析:
#   优先级: 环境变量 DATABASE_URL > app.config.settings.database_url
# 用法:
#   DATABASE_URL=sqlite:///tmp.db alembic upgrade head
#   DATABASE_URL=postgresql+asyncpg://aiops:aiops@localhost:5432/aiops alembic upgrade head

[alembic]
script_location = alembic
# 不硬编码 sqlalchemy.url, env.py 里从 app.config / 环境变量读取
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
